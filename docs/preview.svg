<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="640" height="300" fill="#1c1c1e"/>

  <!-- Menüleiste -->
  <rect width="640" height="28" fill="#2c2c2e"/>
  <text x="16" y="19" font-size="13" fill="#e5e5ea">Finder</text>
  <text x="470" y="19" font-size="13" fill="#e5e5ea">WLAN</text>
  <text x="560" y="19" font-size="13" fill="#e5e5ea">Do 23:20</text>

  <!-- Zwei Ringe: links 5 h (68 % Rest), rechts Woche (19 % Rest) -->
  <g transform="translate(395,3)" fill="none" stroke-width="3" stroke-linecap="round">
    <circle cx="11" cy="11" r="8" stroke="#808080" stroke-opacity="0.3"/>
    <path d="M11 3 A8 8 0 1 1 3.8 14.4" stroke="#34c759"/>
    <circle cx="31" cy="11" r="8" stroke="#808080" stroke-opacity="0.3"/>
    <path d="M31 3 A8 8 0 0 1 38.4 8.1" stroke="#ff9f0a"/>
  </g>

  <!-- Aufklappmenü -->
  <rect x="330" y="32" width="300" height="148" rx="10" fill="#323235" stroke="#48484a"/>
  <text x="346" y="58" font-size="13" fill="#f2f2f7">5-Stunden-Limit: 68 % übrig · Reset in 2 Std 14 Min</text>
  <text x="346" y="82" font-size="13" fill="#f2f2f7">Wochenlimit: 19 % übrig · Reset in 3 T 4 Std</text>
  <line x1="340" y1="96" x2="620" y2="96" stroke="#48484a"/>
  <text x="346" y="116" font-size="12" fill="#8e8e93">Stand: vor 2 Min</text>
  <line x1="340" y1="128" x2="620" y2="128" stroke="#48484a"/>
  <text x="346" y="148" font-size="13" fill="#f2f2f7">Aktualisieren</text>
  <text x="346" y="168" font-size="13" fill="#f2f2f7">Beenden</text>

  <!-- Legende -->
  <text x="24" y="90" font-size="15" fill="#f2f2f7" font-weight="600">ClaudeStats</text>
  <text x="24" y="114" font-size="12" fill="#aeaeb2">Links: 5-Stunden-Limit</text>
  <text x="24" y="132" font-size="12" fill="#aeaeb2">Rechts: Wochenlimit</text>
  <text x="24" y="156" font-size="12" fill="#aeaeb2">Die Ringe zählen runter:</text>
  <text x="24" y="174" font-size="12" fill="#aeaeb2">voll = viel übrig, leer = Limit erreicht.</text>
  <circle cx="30" cy="200" r="5" fill="#34c759"/><text x="42" y="204" font-size="12" fill="#aeaeb2">ab 30 % Rest</text>
  <circle cx="30" cy="220" r="5" fill="#ff9f0a"/><text x="42" y="224" font-size="12" fill="#aeaeb2">10–30 % Rest</text>
  <circle cx="30" cy="240" r="5" fill="#ff453a"/><text x="42" y="244" font-size="12" fill="#aeaeb2">unter 10 % Rest</text>

  <text x="320" y="288" font-size="11" fill="#636366" text-anchor="middle">Mockup – echter Screenshot folgt nach dem ersten Lauf</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
